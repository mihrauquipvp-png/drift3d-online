const ob=(a,k,l,cur)=>'<div class="swr">'+l.map(([v,n])=>'<button class="t'+(v===cur?' on':'')+'" data-'+a+'="'+k+'" data-v=\''+JSON.stringify(v)+'\'>'+n+'</button>').join('')+'</div>';
function cusUI(){const u=getCU(selCar),o=(k,l)=>ob('k',k,l,u[k]);$('cus').innerHTML=
'<div class="lb">COR DA PINTURA</div>'+sw('paint',PAL,u.paint)+'<input type="color" class="cp" data-k="paint" value="'+u.paint+'">'+
'<div class="lb">FAIXA / ADESIVO</div>'+sw('stripe',['',...PAL],u.stripe)+
'<div class="lb">COR DO ARO</div>'+sw('rim',PAL.concat(['#d8b040','#c8ccd4']),u.rim)+
'<div class="lb">ESTILO DO ARO</div>'+o('rs',[[0,'5 raios'],[1,'8 raios'],[2,'Disco']])+
'<div class="lb">AEROFÓLIO</div>'+o('wing',[[0,'Nenhum'],[1,'GT'],[2,'Ducktail']])+o('wc',[[0,'Carbono'],[1,'Cor da pintura']])+
'<div class="lb">NEON NO CHÃO</div>'+sw('neon',NEO,u.neon)+
'<div class="lb">KIT LARGO</div>'+o('wide',[[1,'Ligado'],[0,'Desligado']])+
'<div class="lb">VIDROS</div>'+o('tint',[[0,'Claro'],[1,'Médio'],[2,'Escuro']])}
$('cus').addEventListener('click',e=>{const b=e.target.closest('button');if(b&&b.dataset.k){const w=document.querySelector('#p_cust').scrollTop;setCU(b.dataset.k,JSON.parse(b.dataset.v));cusUI();document.querySelector('#p_cust').scrollTop=w}});
$('cus').addEventListener('input',e=>{if(e.target.type==='color')setCU(e.target.dataset.k,e.target.value)});
$('cre').onclick=()=>{if(save.cust)delete save.cust[selCar];persist();buildCar();cusUI()};
function cfgUI(){const r=(c,n)=>'<label class="sl">'+n+'<span>'+CF[c]+'%</span><input type="range" min="0" max="100" value="'+CF[c]+'" data-c="'+c+'"></label>',o=(c,n,l)=>'<div class="lb">'+n+'</div>'+ob('c',c,l,CF[c]);
$('cfg').innerHTML=r('vol','VOLUME GERAL')+r('sens','SENSIBILIDADE DA DIREÇÃO')+r('cd','DISTÂNCIA DA CÂMERA')+r('fov','CAMPO DE VISÃO')+
o('q','QUALIDADE GRÁFICA',[[0,'Baixa'],[1,'Média'],[2,'Alta']])+o('unit','UNIDADE',[[0,'km/h'],[1,'mph']])+o('shake','TREMOR DE CÂMERA',[[1,'Ligado'],[0,'Desligado']])+o('mini','MINIMAPA',[[1,'Ligado'],[0,'Desligado']])+o('online','MULTIPLAYER ONLINE',[[1,'Ligado'],[0,'Desligado']])+'<div class="lb">SEU NOME</div><input class="tx" data-s="name" maxlength="14" placeholder="Piloto" value="'+esc(CF.name)+'"><div class="lb">ENDEREÇO DO SERVIDOR (vazio = este site)</div><input class="tx" data-s="srv" placeholder="https://drift3d-online-1.onrender.com" value="'+esc(CF.srv)+'">'}
$('cfg').addEventListener('input',e=>{const k=e.target.dataset.s;if(k){CF[k]=e.target.value;save.cfg=CF;persist()}});
$('cfg').addEventListener('input',e=>{const c=e.target.dataset.c;if(!c)return;CF[c]=+e.target.value;e.target.previousElementSibling.textContent=CF[c]+'%';save.cfg=CF;persist()});
$('cfg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!b.dataset.c)return;const c=b.dataset.c;CF[c]=JSON.parse(b.dataset.v);save.cfg=CF;persist();if(c==='q'){cfq=CF.q;rs()}cfgUI()});
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.pn').forEach(x=>x.classList.toggle('on',x.id==='p_'+b.dataset.p))});
function refreshMenu(){const C=CARS[selCar];buildCar();tunUI();cusUI();cfgUI();$('cn').textContent=C.n;
const mx=k=>Math.round(k*100);$('stt').innerHTML=[['VELOCIDADE',(C.vmax-50)/28],['ACELERAÇÃO',(C.acc-24)/22],['CONTROLE',(7-C.grip)/2.2],['DIREÇÃO',(C.st-1.6)/.7]].map(([n,v])=>'<div class="st"><span>'+n+'</span><i><u style="width:'+Math.max(12,Math.min(100,mx(v)))+'%"></u></i></div>').join('');
$('trs').innerHTML=TRACKS.map((t,i)=>'<button class="tk'+(i===selTrk?' on':'')+'" data-t="'+i+'">'+t.n+'<small>'+t.d+(save['s'+i]?' • ★'+save['s'+i]:'')+'</small></button>').join('');
document.querySelectorAll('.tk').forEach(b=>b.onclick=()=>{selTrk=+b.dataset.t;build(selTrk);refreshMenu()});
save.car=selCar;save.trk=selTrk;persist()}
function startRace(){audio();reset();netConnect();S='count';$('menu').classList.remove('on');$('home').classList.remove('on');$('end').classList.remove('on');$('hud').classList.add('on');$('top').classList.add('on');if('ontouchstart'in window||navigator.maxTouchPoints>0)$('tc').classList.add('on')}
function toMenu(){S='menu';netClose();silence();build(selTrk);for(const k in keys)keys[k]=false;$('hud').classList.remove('on');$('top').classList.remove('on');$('tc').classList.remove('on');$('end').classList.remove('on');$('home').classList.add('on');home=true;$('cd').textContent='';refreshMenu()}
$('cp').onclick=()=>{selCar=(selCar+CARS.length-1)%CARS.length;refreshMenu()};
$('cx').onclick=()=>{selCar=(selCar+1)%CARS.length;refreshMenu()};
$('play').onclick=()=>{CF.online=0;save.cfg=CF;persist();startRace()};
function openMultiConfig(){
  CF.online=1;save.cfg=CF;persist();
  home=false;$('home').classList.remove('on');$('menu').classList.add('on');
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.p==='cfg'));
  document.querySelectorAll('.pn').forEach(p=>p.classList.toggle('on',p.id==='p_cfg'));
  cfgUI();
}
function startMulti(){
  CF.online=1;
  if(!CF.srv.trim()) CF.srv='https://drift3d-online-1.onrender.com';
  save.cfg=CF;persist();startRace();
}
$('bmultihome').onclick=openMultiConfig;
$('multiplay').onclick=startMulti;
$('bmenu').onclick=()=>{home=false;$('home').classList.remove('on');$('menu').classList.add('on')};$('back').onclick=()=>{home=true;$('menu').classList.remove('on');$('home').classList.add('on')};$('again').onclick=startRace;$('tomenu').onclick=toMenu;$('bm').onclick=toMenu;
$('bs').onclick=()=>{muted=!muted;$('bs').textContent=muted?'🔇 Mudo':'🔊 Som'};
const KM={ArrowLeft:'L',KeyA:'L',ArrowRight:'R',KeyD:'R',ArrowUp:'U',KeyW:'U',ArrowDown:'D',KeyS:'D',Space:'S'};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'&&e.target.type==='text')return;const k=KM[e.code];if(k){keys[k]=true;e.preventDefault()}
if(e.code==='KeyR'&&(S==='race'||S==='count'))startRace();if(e.code==='Escape'&&S!=='menu')toMenu();if(e.code==='KeyM')$('bs').click();
if(e.code==='Enter'&&S==='menu')home?$('bmenu').click():startRace()});
addEventListener('keyup',e=>{const k=KM[e.code];if(k)keys[k]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
document.querySelectorAll('#tc button').forEach(b=>{const k=b.dataset.k,on=e=>{keys[k]=true;e.preventDefault()},off=e=>{keys[k]=false;e.preventDefault()};b.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(n=>b.addEventListener(n,off))});
document.addEventListener('contextmenu',e=>e.preventDefault());
if(!CanvasRenderingContext2D.prototype.roundRect)CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h){this.rect(x,y,w,h)};
build(selTrk);refreshMenu();requestAnimationFrame(frame);
</script></body></html>
